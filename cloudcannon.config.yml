_schema: _schema
paths:
  uploads: static/uploads
  static: static
collections_config:
  content:
    path: content
    name: Pages
    icon: wysiwyg
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  pathfinder:
    path: content/pathfinder
    name: Pfadfinder
    singular_name: Profil
    description: Meeresschutz-Pfadfinder – „_index“ enthält die Seitentexte, jede weitere Datei ist ein Profil.
    icon: explore
    disable_url: true
    disable_add_folder: true
    sort:
      key: weight
      order: asc
    schemas:
      default:
        path: .cloudcannon/schemas/pathfinder-profil.md
        name: Profil
        icon: person
    _inputs:
      title:
        type: text
        label: Name
      weight:
        type: number
        label: Reihenfolge
        comment: Kleinere Zahl = weiter oben (z. B. 10, 20, 30 …)
      foto:
        type: image
        label: Foto
        comment: Hochformat oder quadratisch. Bei Video ist das Foto zugleich das Vorschaubild.
      bildausschnitt:
        type: text
        label: Bildausschnitt
        comment: 'Welcher Teil des Fotos sichtbar ist, z. B. „50% 20%“ (waagerecht, senkrecht). Kleinere zweite Zahl = weiter oben.'
      video:
        type: file
        label: Video (optional)
        comment: MP4-Datei. Leer lassen, wenn es kein Video gibt.
      video_dauer:
        type: text
        label: Videolänge
        comment: z. B. 1:46
      ansprechbar:
        type: switch
        label: Ansprechbar („Frag … direkt“-Button)
      teaser:
        type: textarea
        label: Zitat / Teaser
        comment: Ohne Anführungszeichen – die werden automatisch ergänzt.
      schwerpunkte:
        type: multiselect
        label: Schwerpunkte (Filter)
        comment: Daraus entstehen die Filter-Buttons oben auf der Seite.
        options:
          allow_create: true
          values:
            - Biodiversität
            - Fischerei
            - Klima
            - Meereslebewesen
            - Meerespolitik
            - Praktischer Meeresschutz
            - Schadstoffe
            - Umweltmanagement
      expertise:
        type: array
        label: Expertise
      stationen:
        type: array
        label: Stationen des Weges
        comment: Reihenfolge per Drag & Drop
        options:
          structures:
            values:
              - label: Station
                value:
                  label:
                  text:
      label:
        type: text
        label: Art (z. B. Schule, Bachelor, Praktikum)
      text:
        type: text
        label: Was / Wo
      # Seitentexte in _index.md
      untertitel:
        type: text
        label: Untertitel
      beta:
        type: switch
        label: Beta-Hinweis anzeigen
      einleitung:
        type: markdown
        label: Einleitung
      hinweis:
        type: text
        label: Hinweis-Box (leer = keine Box)
      filter_frage:
        type: text
        label: Überschrift über den Filtern
      zusaetzliche_filter:
        type: array
        label: Zusätzliche Filter
        comment: Filter, die angezeigt werden, auch wenn noch kein Profil diesen Schwerpunkt hat.
      ergebnis_text:
        type: text
        label: Text über den Profilen
        comment: '{anzahl} wird automatisch durch die Zahl der Profile ersetzt (z. B. „sieben“).'
      kontakt_email:
        type: email
        label: E-Mail für „Frag … direkt“
      studiengaenge:
        type: array
        label: Relevante Studiengänge
        comment: Werden automatisch alphabetisch sortiert.
        options:
          structures:
            values:
              - label: Studiengang
                value:
                  name:
                  info:
                  url:
      info:
        type: textarea
        label: Beschreibung
      url:
        type: url
        label: Link
      beschreibung:
        type: textarea
        label: Beschreibung
      jobs:
        type: array
        label: Jobs & Praktika finden
        options:
          structures: _structures.pf_link
      freiwilligenarbeit:
        type: array
        label: Freiwillig mitmachen
        options:
          structures: _structures.pf_link
      description:
        type: textarea
        label: Beschreibung für Suchmaschinen / Social Media
      image:
        type: image
        label: Vorschaubild für Social Media
      cascade:
        hidden: true
    _structures:
      pf_link:
        values:
          - label: Link
            value:
              name:
              url:
              beschreibung:
  data:
    path: data
    name: Slider u.a.
    icon: data_usage
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  posts:
    path: /content/posts
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
      blogs:
        type: multiselect
        options:
          allow_create:
          empty_type: array
          values:
            - Good News
            - Politik
            - Reflexionen
            - Klima
            - Tiefsee
            - Überfischung
            - Forschung
            - Kultur
            - Was tun
          value_key:
          preview:
          picker_preview:
          view:
          picker_view:
        cascade: true
      image:
        type: image
        cascade: true
      image_caption:
        type: text
        options:
          empty_type:
        cascade: true
      author:
        type: select
        options:
          allow_create: true
          allow_empty: false
          values:
            - DEEPWAVE
          value_key:
          preview:
          picker_preview:
          view:
          picker_view:
        cascade: true
      source:
        type: text
        cascade: true
    _select_data:
    _structures:
    add_options: []
    create:
    disable_add: false
    disable_add_folder: true
    disable_file_actions: false
    new_preview_url:
    schemas:
      blog_post:
        path: .cloudcannon/schemas/post.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        icon: post_add
  timeline:
    path: /content/ueber uns/was wir tun
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
      key: date
      order: desc
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
    _select_data:
    _structures:
    add_options:
    create:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url:
    schemas:
    schema_key:
  newsletter:
    path: /content/newsletter
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
      key: date
      order: desc
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      image:
        type: image
        cascade: true
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
      id:
        type: number
        cascade: true
    _select_data:
    _structures:
    add_options:
    create:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url:
    schemas:
    schema_key:
_select_data:
  Categories: []
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
timezone: Europe/London
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: true
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
