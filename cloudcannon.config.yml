_schema: _schema
paths:
  uploads: static/uploads
  static: static
collections_config:
  content:
    path: content
    name: Pages
    icon: wysiwyg
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  data:
    path: data
    name: Slider u.a.
    icon: data_usage
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  pathfinder:
    path: content/pathfinder
    glob:
      - '*.md'
      - '!_index.md'
    name: Pathfinder – Personen
    singular_name: Person
    icon: explore
    url: /pathfinder/{filename}/
    disable_url: false
    disable_add: false
    disable_add_folder: true
    disable_file_actions: false
    sort:
      key: weight
      order: asc
    add_options:
      - name: Neue Person
        schema: person
    schemas:
      person:
        path: .cloudcannon/schemas/pathfinder-person.md
        name: Neue Person
        icon: person_add
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
    _inputs:
      title:
        type: text
        label: Name
        comment: Vor- und Nachname, so wie er auf der Seite stehen soll. Der erste Teil wird für „Frag …“ verwendet.
      weight:
        type: number
        label: Reihenfolge
        comment: Kleinere Zahl steht weiter oben. Leer oder 0 heißt ganz unten.
      draft:
        type: switch
        label: Entwurf (nicht veröffentlichen)
      photo:
        type: image
        label: Foto
        comment: Quadratisch oder hochkant. Ohne Foto wird das Video-Poster oder ein Initialen-Kreis gezeigt.
      photo_position:
        type: text
        label: Bildausschnitt
        comment: 'Wo das Bild beim Zuschneiden verankert ist, z. B. "50% 20%" (waagerecht, senkrecht). 0% = oben/links, 100% = unten/rechts.'
      video:
        type: url
        label: Video
        comment: Link auf eine Videodatei (mp4). Große Dateien bitte nicht ins Repo, sondern über Cloudinary einbinden.
      video_poster:
        type: image
        label: Video-Poster
      video_duration:
        type: text
        label: Videolänge
        comment: z. B. 1:46
      teaser:
        type: textarea
        label: Teaser
        comment: Ein bis zwei Sätze in der Ich-Form. Erscheint als Zitat in der aufgeklappten Karte.
      ansprechbar:
        type: switch
        label: Ansprechbar
        comment: Zeigt den Button „Frag <Vorname>“ (geht an die zentrale Adresse).
      vorname:
        type: text
        label: Vorname für den Button
        comment: Nur ausfüllen, wenn der erste Teil des Namens nicht passt.
      schwerpunkte:
        type: multiselect
        label: Schwerpunkte
        comment: Daraus werden die Filter oben auf der Seite gebildet. Die Auswahlliste steht unter „Slider u.a.“ in pathfinder_schwerpunkte.
        options:
          values: data.pathfinder_schwerpunkte
          allow_create: true
      expertise:
        type: array
        label: Expertise
        comment: Kurze Stichworte, ein Eintrag pro Zeile.
        options:
          empty_type: text
      steps:
        type: array
        label: Stationen
        comment: Der Weg in Etappen, von früh nach spät.
        options:
          structures:
            values:
              - label: Station
                icon: flag
                preview:
                  text:
                    - key: label
                  subtext:
                    - key: value
                value:
                  label:
                  value:
            style: select
        _inputs:
          label:
            type: text
            label: Etappe
            comment: z. B. Schule, Bachelor, Praktikum, Promotion
          value:
            type: text
            label: Was
      content:
        label: Geschichte
        comment: Die ausführliche Geschichte. Überschriften, Zitate und Bilder (mit Bildunterschrift im Titel-Feld) sind möglich.
  posts:
    path: /content/posts
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
      blogs:
        type: multiselect
        options:
          allow_create:
          empty_type: array
          values:
            - Good News
            - Politik
            - Reflexionen
            - Klima
            - Tiefsee
            - Überfischung
            - Forschung
            - Kultur
            - Was tun
          value_key:
          preview:
          picker_preview:
          view:
          picker_view:
        cascade: true
      image:
        type: image
        cascade: true
      image_caption:
        type: text
        options:
          empty_type:
        cascade: true
      author:
        type: select
        options:
          allow_create: true
          allow_empty: false
          values:
            - DEEPWAVE
          value_key:
          preview:
          picker_preview:
          view:
          picker_view:
        cascade: true
      source:
        type: text
        cascade: true
    _select_data:
    _structures:
    add_options: []
    create:
    disable_add: false
    disable_add_folder: true
    disable_file_actions: false
    new_preview_url:
    schemas:
      blog_post:
        path: .cloudcannon/schemas/post.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        icon: post_add
  timeline:
    path: /content/ueber uns/was wir tun
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
      key: date
      order: desc
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
    _select_data:
    _structures:
    add_options:
    create:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url:
    schemas:
    schema_key:
  newsletter:
    path: /content/newsletter
    glob:
    name:
    singular_name:
    icon: notes
    url:
    disable_url: false
    include_developer_files:
    documentation:
    description: ''
    preview:
    sort:
      key: date
      order: desc
    sort_options:
    _editables:
    _enabled_editors:
    _inputs:
      image:
        type: image
        cascade: true
      date:
        type: date
        options:
          timezone:
          empty_type:
        instance_value: NOW
        cascade: true
      id:
        type: number
        cascade: true
    _select_data:
    _structures:
    add_options:
    create:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url:
    schemas:
    schema_key:
_select_data:
  Categories: []
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
timezone: Europe/London
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: true
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
