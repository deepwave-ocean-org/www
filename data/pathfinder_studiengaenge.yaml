- name: BSc Umweltwissenschaften (HAW Hamburg)
  info: Praxisnahes Studium rund um Umweltschutz, das naturwissenschaftliche Grundlagen mit Umweltmanagement und -technik verbindet.
  url: https://www.haw-hamburg.de/en/bachelor-environmental-engineering/
- name: Biologie
  info: Breit angelegtes Biologie-Studium mit Grundlagen zu Tieren, Pflanzen, Zellen und Ökosystemen – nicht meeresspezifisch, aber die beste Voraussetzung für spätere Spezialisierungen.
  url: https://www.studycheck.de/studium/biologie
- name: 'Climate Physics: Meteorology and Physical Oceanography'
  info: Englischsprachiger Masterstudiengang der Uni Kiel (in Kooperation mit GEOMAR) zu den physikalischen Grundlagen des Klimasystems – Meteorologie und physikalische Ozeanographie.
  url: https://www.studium.uni-kiel.de/de/studienangebot/studienfaecher/climate-physics-meteorology-and-physical-oceanography-ma
- name: Earth System Science
  info: Englischsprachiger Masterstudiengang der Universität Mainz zum Erdsystem als Ganzes – von Klimaarchiven über Geophysik bis zur Auswertung komplexer Umweltdaten.
  url: https://physik.uni-mainz.de/start/studium/studiensteckbrief-msc-earth-system-science/
- name: Environmental Science & Business Mgmt (London)
  info: Verbindet Umweltwissenschaft mit Wirtschaftswissen, für alle, die verstehen wollen, wie Umweltschutz und wirtschaftliche Entscheidungen zusammenhängen.
  url: https://www.qmul.ac.uk/undergraduate/coursefinder/courses/2027/environmental-science-with-business-management/
- name: Global Change Management
  info: Studiengang der Hochschule für nachhaltige Entwicklung Eberswalde zum Umgang mit globalem Wandel – verbindet Naturwissenschaft mit Management- und Politikkompetenz.
  url: https://www.hnee.de/de/Studium/Masterstudiengnge/Global-Change-Management/Global-ChangeManagement-M.Sc.-GCM-K381.htm
- name: Global Environmental and Sustainability Studies
  info: Interdisziplinärer Studiengang der Leuphana Universität Lüneburg zu globalen Umwelt- und Nachhaltigkeitsfragen, verbindet Natur- und Sozialwissenschaften.
  url: https://www.leuphana.de/en/college/bachelor/bsc-global-environmental-and-sustainability-studies.html
- name: MRes Marine Biology
  info: Forschungsorientierter Master, in dem man früh eigene Studien zu Meereslebewesen durchführt statt nur Vorlesungen zu besuchen.
  url: https://www.plymouth.ac.uk/courses/postgraduate/mres-marine-biology
- name: MSc Organismic Evolution & Paleobiology (Bonn)
  info: Master zur Evolution von Lebewesen anhand von Fossilien – hier der Umweg, der später zur Meeresforschung führte.
  url: https://www.uni-bonn.de/en/studying/degree-programs/degree-programs-a-z/organismic-biology-evolutionary-biology-and-palaeobiology-oep-biology-msc
- name: Marine Biology
  info: Bachelor- und Masterstudiengang in Marinbiologie an der Universität Stockholm mit Fokus auf Ökologie, Mikrobiologie und Feldarbeit in nordischen und tropischen Gewässern.
  url: https://www.su.se/english/search-courses-and-programmes/nmark-1.412289
- name: Marine Ecosystem and Fisheries Science (MarSys)
  info: Englischsprachiger Forschungsmaster der Uni Hamburg zu Ökosystemen im Meer und nachhaltigem Fischereimanagement – der häufigste Weg in dieser Übersicht.
  url: https://www.biologie.uni-hamburg.de/en/studium/master/i-marsys.html
- name: Marine Environment & Resources (Erasmus Mundus, Spanien)
  info: Internationaler Master an mehreren europäischen Unis zu Meeresumwelt und nachhaltiger Nutzung mariner Ressourcen.
  url: https://merconsortium.eu/programme/
- name: Marine Ökosystem- & Fischereiwissenschaft (MarSys)
  info: Studiengang speziell zu Lebewesen und Ökosystemen im Meer sowie zur nachhaltigen Nutzung von Fischbeständen.
  url: https://www.min-studieren.uni-hamburg.de/studium/biologie/bachelor-marine-oekosystem-und-fischereiwissenschaften/
- name: Ozeanographie
  info: Naturwissenschaftlicher Studiengang der Uni Kiel zu den physikalischen, chemischen und biologischen Prozessen im Ozean.
  url: https://www.studium.uni-kiel.de/de/studienangebot/studienfaecher/biological-oceanography-ma
- name: Staatsexamen Bio/Geo Lehramt
  info: Abschluss für angehende Lehrkräfte in Biologie und Erdkunde – kein Forschungsweg, aber eine Möglichkeit, Meeresschutz-Wissen in die Schule zu tragen.
  url: ''
