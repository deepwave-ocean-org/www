<div class="flex flex-wrap justify-center gap-16 mb-16">
    {{ range . }}
    <div class="w-full md:w-1/3 md:max-w-[calc(33.333%-6rem)] mb-6 md:mb-0">
        <a href="{{ .url }}" {{ if or (hasPrefix .url "http://" ) (hasPrefix .url "https://" ) }}
            target="_blank" rel="noopener noreferrer" {{ end }} class="block">
            <div class="relative group">
                {{ partial "img/img" (dict "src" .image "alt" .title "class" "" "img_class" "aspect-square rounded-full overflow-hidden scale-80 origin-top w-full h-full object-cover") }}
            </div>
            <div class="w-full flex flex-col justify-center items-center text-center -mt-8">
                <h3 class="text-2xl mb-1">{{ .title }}</h3>
            </div>
        </a>
    </div>
    {{ end }}
</div>
