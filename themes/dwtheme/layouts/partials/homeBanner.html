{{ $background := .background_image }}
{{ $fileExt := strings.ToLower (path.Ext $background) }}

<div class="relative w-full h-108 overflow-hidden">
  {{ if or (eq $fileExt ".mp4") (eq $fileExt ".webm") (eq $fileExt ".mov") }}
  <!-- Video background -->
  <video class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline>
    <source src="{{ $background }}" type="{{ if eq $fileExt ".webm" }}video/webm{{ else if eq $fileExt ".mov" }}video/quicktime{{ else }}video/mp4{{ end }}">
  </video>
  {{ else }}
  <!-- Image background -->
  <div class="absolute inset-0 w-full h-full bg-cover bg-center">
    <img data-src='{{ partial "img/src" $background }}' class="cld-responsive object-cover h-full w-full" loading="lazy" />
  </div>
  {{ end }}

  <!-- Overlay with configurable color -->
  <div class="absolute inset-0 opacity-50"
    style='background: linear-gradient(90deg, transparent, rgb(0 0 0 / 60%) 30%, rgb(0 0 0 / 60%) 70%, transparent); background-color: {{ .overlay_color | default "#43494b" }}'>
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full text-center text-white px-8">
    <h2 class="text-4xl md:text-5xl text-shadow mb-6 mx-6">{{ .title }}</h2>
    {{ if and .button_text .link }}
    <a href="{{ .link }}"
      class="px-8 py-3 text-xl text-white rounded-md border-2 border-white hover:!bg-gray-100 hover:text-gray-800 hover:border-2 hover:border-gray-100 font-sans" style='background-color: {{ .button_overlay | default "transparent" }}'>
      {{ .button_text }}
    </a>
    {{ end }}
  </div>
</div>
