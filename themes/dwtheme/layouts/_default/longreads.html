{{ define "main" }}
{{ if .Title }}
    {{ partial "headers/default_parallax" . }}
{{ end }}
<div class="not_full_width min-h-screen my-12">
    {{ with .Content }}
    {{ . }}
    {{ partial "divider" . }}
    {{ end }}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Params.longreads }}
            {{ with site.GetPage . }}
                {{ partial "longread-card" . }}
            {{ end }}
        {{ end }}
    </div>
</div>
{{ end }}
