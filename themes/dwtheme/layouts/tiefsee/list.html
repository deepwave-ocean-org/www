{{ define "main" }}
<style>
footer {
  margin-top: 0;
}
</style>
<main class="bg-[#161817]">
  <section class="max-w-[80svw] lg:max-w-[70svw] mx-auto py-12 pb-40 flex flex-col items-center justify-between">

    {{ with .Params.heroimage }}
    <div class="w-[80svw] lg:w-[70svw]">
      <section>
        <img src="{{ if hasPrefix . "http" }}{{ . }}{{ else }}{{ $.Page.RelPermalink }}{{ . }}{{ end }}" alt="Hero Image" class="h-[30svh] w-full object-cover object-bottom">
      </section>
    </div>
    {{ end }}

    <section class="flex flex-col lg:flex-row gap-10 mt-12 w-full">
      {{/* Text Block */}}
      <div class="flex-[2] min-w-[40svw] text-[#8e8e8a] font-serif leading-relaxed">
        <h1 class="font-sans text-4xl pb-2">{{ .Title }}</h1>
        <div class="prose prose-invert prose-p:text-[#8e8e8a] prose-p:text-lg lg:prose-p:text-sm prose-p:leading-relaxed lg:prose-p:leading-normal prose-p:pb-4 prose-p:last:pb-0 prose-strong:font-extrabold prose-em:italic prose-a:text-[#2298a5] prose-a:no-underline max-w-none">
          {{ .Content }}
        </div>
      </div>

      {{/* Sidebar */}}
      <div class="flex flex-col lg:flex-col-reverse self-start flex-1 min-w-[20vw]">
        <aside class="font-sans">
          <ul class="list-none p-0 m-0">
            {{ range .Params.subpages }}
            <li class="p-4 pt-0 first:pt-4 bg-[#262626] font-bold text-[22px]">
              <a href="{{ .url }}" class="text-[#2298a5] no-underline hover:underline">{{ .title }}</a>
            </li>
            {{ end }}
          </ul>
        </aside>
      </div>
    </section>
  </section>
</main>
{{ end }}
